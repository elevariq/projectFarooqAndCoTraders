<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Workspace — Farooq &amp; Co Traders</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --violet:#7C3AED; --violet-600:#6D28D9; --violet-700:#5B21B6; --violet-50:#F4EFFF; --violet-100:#E7DCFF;
  --emerald:#16A36A; --emerald-d:#0F7A50; --emerald-l:#34D399; --emerald-soft:#E7F7F0;
  --amber:#E9A23B; --amber-soft:#FDF3E4; --amber-ink:#8A5A0C;
  --red:#E5484D; --red-soft:#FDECEC; --red-ink:#A32E2E;
  --canvas:#F4F4F7; --surface:#FFFFFF; --surface-2:#FAFAFB; --ivory:#F7F7FA;
  --shell:#0E0B18; --shell-2:#171227;
  --ink:#12111A; --ink-2:#5B5F72; --ink-3:#696D80;
  --line:#E8E8EE; --line-soft:#F1F1F5;
  --r-xl:24px; --r-lg:18px; --r:14px; --r-sm:10px;
  --sh-1:0 1px 2px rgba(18,17,26,.05);
  --sh-2:0 2px 4px rgba(18,17,26,.04), 0 8px 20px rgba(18,17,26,.06);
  --sh-3:0 10px 22px rgba(18,17,26,.1), 0 28px 56px rgba(18,17,26,.12);
  --sh-accent:0 8px 24px rgba(124,58,237,.28);
  --f:"Manrope", ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ease:cubic-bezier(.32,.72,0,1); --spring:cubic-bezier(.34,1.4,.64,1);
  --rail:238px;
}
html[data-theme="dark"]{
  --canvas:#08070D; --surface:#141220; --surface-2:#1B1829; --ivory:#1B1829;
  --shell:#0E0B18; --shell-2:#171227;
  --ink:#F4F3F8; --ink-2:#A5A3B8; --ink-3:#918FA6;
  --line:#292539; --line-soft:#221E31;
  --violet-50:#241A3D; --violet-100:#2F2350;
  --emerald-soft:#12291F; --amber-soft:#2C2110; --red-soft:#2E1518;
  --emerald-d:#48D39A; --amber-ink:#F0B45E; --red-ink:#FF8A8A;
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 8px 24px rgba(0,0,0,.45);
  --sh-3:0 24px 60px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--f);background:var(--canvas);color:var(--ink);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;letter-spacing:-.014em}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
svg{display:block}
.num{font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.03em}
.banner{display:flex;gap:12px;padding:15px 17px;border-radius:14px;border:1px solid;align-items:flex-start}
.banner svg{width:20px;height:20px;flex:0 0 20px;margin-top:2px}
.banner b{display:block;font-size:15.5px;font-weight:700;margin-bottom:3px}
.banner p{margin:0;font-size:14.5px;line-height:1.55}
.banner.warn{background:var(--amber-soft);border-color:#F0DDBE;color:var(--amber-ink)}
.banner.err{background:var(--red-soft);border-color:#F5C9C9;color:var(--red-ink)}
.banner.info{background:var(--violet-50);border-color:var(--violet-100);color:var(--violet)}
html[data-theme="dark"] .banner.warn{border-color:#5B4519}
html[data-theme="dark"] .banner.err{border-color:#5A2A25}
html[data-theme="dark"] .warn{border-color:#5A2A25}
.enter>*{animation:up .4s var(--ease) both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.enter>*:nth-child(2){animation-delay:.05s}.enter>*:nth-child(3){animation-delay:.1s}
.enter>*:nth-child(4){animation-delay:.15s}.enter>*:nth-child(5){animation-delay:.2s}
/* Urdu (§14) — product names are read at arm's length here, so they run large */
.ur{display:inline-block;font-family:'Noto Nastaliq Urdu','Jameel Noori Nastaleeq','Noto Naskh Arabic',var(--f);
  font-size:1.3em;line-height:1.85;unicode-bidi:isolate;direction:rtl;font-weight:500;
  color:inherit;vertical-align:-3px;max-width:100%}
.rn{color:var(--ink-2);font-weight:600;font-size:.88em;margin-inline-start:7px;unicode-bidi:isolate;vertical-align:1px}
.pick[aria-pressed="true"] .ur,.nv[aria-current="page"] .ur{color:inherit}
.row .nm b .ur{font-size:1.24em}
/* a product name's Urdu part is a span inside <b>: the row's own "span" rule made it a full-width block, so it sat at the far
   side of the cell while the English line under it sat at the near side. It stays inline, at the start, like the English. */
.row .nm b .ur,.pick b .ur,.ev .tx b .ur,.ci b .ur{display:inline-block}
.row .nm b .ur,.pick b .ur{vertical-align:baseline;line-height:1.7}
.row .nm>span{margin-top:3px}
.pick .ur{font-size:1.22em;line-height:1.7}
.ci .ur{font-size:1.2em}
:focus-visible{outline:2.5px solid var(--violet);outline-offset:3px;border-radius:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}

/* ══ Shell — the same frame as the office app: a fixed side menu, a top bar, then the page ══ */
.shell{display:block;min-height:100vh}
.rail{width:var(--rail);background:var(--surface);border-right:1px solid var(--line);position:fixed;inset:0 auto 0 0;
  height:100vh;z-index:60;display:flex;flex-direction:column;transition:width .18s ease}
.brand{display:flex;align-items:center;gap:11px;padding:18px 16px 16px;border-bottom:1px solid var(--line-soft)}
/* the logo is a MARK here: the F-and-wheat monogram cropped from logo.png, because the name is written beside it */
.logo{width:38px;height:38px;flex:0 0 38px;border-radius:50%;overflow:hidden;background:#fff;box-shadow:0 0 0 1px var(--line);position:relative}
.logo img{display:block;width:100%;height:100%;object-fit:cover;transform-origin:50% 31%;transform:translateY(19%) scale(2.15)}
.brand .bt{min-width:0;overflow:hidden}
.brand b{display:block;font-size:15px;font-weight:800;color:var(--ink);white-space:nowrap;letter-spacing:-.032em}
.brand b em::before{content:'\2009'}.brand b em::after{content:'\2009'}
.brand b em{font-style:normal;color:var(--violet)}
.brand span{display:block;font-size:10px;color:var(--ink-3);font-weight:700;white-space:nowrap;
  letter-spacing:.06em;text-transform:uppercase;margin-top:1px}
.rail nav{padding:10px 10px 16px;flex:1;overflow-y:auto}
.nvg{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);padding:6px 12px}
.nvg::after{content:'';flex:1 1 auto;height:1px;background:var(--line-soft);min-width:8px}
.nvg:first-child{padding-top:2px}
.nvg:not(:first-child){margin-top:8px;padding-top:14px;border-top:1px solid var(--line-soft)}
.nv{display:flex;align-items:center;gap:11px;padding:0 12px;min-height:40px;border-radius:10px;margin-bottom:1px;
  color:var(--ink-2);font-size:14px;font-weight:600;width:100%;text-align:left;position:relative;
  transition:background .14s ease,color .14s ease}
.nv svg{width:18px;height:18px;flex:0 0 18px;color:var(--ink-3)}
.nv .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nv:hover{background:var(--surface-2);color:var(--ink)}
.nv[aria-current="page"]{background:linear-gradient(150deg,#8B5CF6,#6D28D9);color:#fff;box-shadow:var(--sh-accent);font-weight:700}
.nv[aria-current="page"] svg{color:#fff}
.nvb{margin-left:auto;font-size:12.5px;font-weight:800;background:var(--line-soft);color:var(--ink-2);
  border-radius:20px;padding:2px 9px}
.nv[aria-current="page"] .nvb{background:rgba(255,255,255,.24);color:#fff}
.rail-foot{padding:10px;border-top:1px solid var(--line-soft);display:flex;align-items:center;gap:10px}
.av{width:32px;height:32px;flex:0 0 32px;border-radius:9px;display:grid;place-items:center;font-weight:800;
  font-size:13.5px;color:#fff;background:linear-gradient(150deg,#8B5CF6,#6D28D9)}
.rail-foot .ft{min-width:0;overflow:hidden}
.rail-foot b{display:block;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-foot span{display:block;font-size:11.5px;color:var(--ink-3);font-weight:500;white-space:nowrap}
/* the narrow icon rail: no labels, a divider where each group starts, nothing hidden */
body.mini{--rail:68px}
body.mini .brand{justify-content:center;padding-left:0;padding-right:0}
body.mini .brand .bt,body.mini .nv .lb,body.mini .nvb,body.mini .rail-foot .ft,body.mini .nvg{display:none}
body.mini .nv{justify-content:center;padding:0}
body.mini .nv[data-go] .nvdot{display:block}
body.mini .rail-foot{justify-content:center}
body.mini .nvg:not(:first-child){display:block;height:1px;padding:0;margin:8px 4px;border:0;background:var(--line-soft);font-size:0;overflow:hidden}
body.mini .nvg::after{content:none}
.nvdot{display:none;position:absolute;top:8px;right:14px;width:8px;height:8px;border-radius:50%;background:var(--amber);border:2px solid var(--surface)}
body.mini .nvdot{display:block}

.canvas{margin-left:var(--rail);min-width:0;min-height:100vh;display:flex;flex-direction:column;transition:margin .18s ease}

/* ══ Top bar — the same one row as the office app ══ */
.tbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:0 20px;min-height:60px;
  background:color-mix(in srgb, var(--surface) 86%, transparent);backdrop-filter:blur(14px) saturate(180%);
  border-bottom:1px solid var(--line)}
.tbar h2{font-size:17px;font-weight:800;letter-spacing:-.03em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tbar .grow{flex:1}
.kbtn{display:flex;align-items:center;gap:10px;min-height:36px;padding:0 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);font-size:13.5px;font-weight:600;
  width:270px;transition:border-color .16s,background .16s}
.kbtn:hover{border-color:var(--ink-3);background:var(--surface)}
.kbtn svg{width:15px;height:15px;flex:0 0 15px;color:var(--ink-3)}
.kbtn .kt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;color:var(--ink-3)}
.kbd{margin-left:auto;font-size:12px;font-weight:700;color:var(--ink-3);border:1px solid var(--line);
  border-radius:6px;padding:1px 7px;background:var(--surface)}
.tbar .btn{min-height:36px;padding:0 14px;font-size:13.5px;border-radius:9px}
.tbar .btn svg{width:16px;height:16px}
.body{padding:22px 22px 48px;max-width:1320px;width:100%;margin:0 auto;flex:1}

/* ══ Type ══════════════════════════════════════ */
.eyebrow{font-size:12px;color:var(--violet);font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  margin:0 0 10px;display:flex;align-items:center;gap:8px}
h1{font-size:27px;font-weight:800;letter-spacing:-.034em;margin:0;line-height:1.12}
h2{font-size:19px;font-weight:800;letter-spacing:-.028em;margin:0}
h3{font-size:16.5px;font-weight:800;letter-spacing:-.025em;margin:0}
.lead{font-size:15px;color:var(--ink-2);margin:6px 0 0;font-weight:500}
.head{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;margin:14px 0 22px}
.head .grow{flex:1}

/* ══ Buttons ═══════════════════════════════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:44px;padding:0 18px;
  border-radius:12px;font-size:15px;font-weight:700;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);box-shadow:var(--sh-1);transition:transform .18s var(--spring),box-shadow .18s var(--ease),background .16s}
.btn svg{width:18px;height:18px;flex:0 0 18px}
.btn:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.btn:active{transform:translateY(0) scale(.99)}
.btn.em{background:linear-gradient(150deg,#8B5CF6,#6D28D9);border-color:transparent;color:#fff;
  box-shadow:var(--sh-accent)}
.btn.em:hover{box-shadow:0 14px 30px rgba(124,58,237,.34)}
.btn.lg{min-height:50px;font-size:16px;padding:0 22px;border-radius:13px}
.btn.blk{width:100%}
.btn[disabled]{opacity:.42;pointer-events:none;box-shadow:none}
.btns{display:flex;gap:14px;flex-wrap:wrap}

/* ══ Bento ═════════════════════════════════════ */
.bento{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
.b{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;
  box-shadow:var(--sh-1);transition:transform .2s var(--ease),box-shadow .2s var(--ease);position:relative;overflow:hidden}
.b:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.b .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--ivory);
  color:var(--ink);border:1px solid var(--line);margin-bottom:16px}
.b .ic svg{width:19px;height:19px}
.b .v{font-size:28px;font-weight:800;letter-spacing:-.04em;line-height:1.05}
.b .v i{font-style:normal;font-size:15px;font-weight:700;color:var(--ink-2);letter-spacing:-.02em}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:12.5px;
  font-weight:800;position:absolute;top:22px;right:22px}
.chip svg{width:14px;height:14px}
.chip.up{background:var(--emerald-soft);color:var(--emerald-d)}
.chip.dn{background:var(--red-soft);color:var(--red-ink)}
.chip.flat{background:var(--surface-2);color:var(--ink-3)}
.icobtn{width:36px;height:36px;flex:0 0 36px;border-radius:10px;background:none;position:relative;
  display:grid;place-items:center;color:var(--ink-2);transition:background .14s,color .14s}
.icobtn:hover{background:var(--surface-2);color:var(--ink)}
.icobtn svg{width:18px;height:18px}
.icobtn#bellBtn[aria-expanded="true"]{background:var(--violet-50);color:var(--violet)}
.icobtn .dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--surface)}
.icobtn .dot.hide{display:none}
#collapse{display:grid}
.b .l{font-size:14.5px;color:var(--ink-2);font-weight:600;margin-top:5px}
.b .x{font-size:13.5px;color:var(--ink-3);font-weight:600;margin-top:14px;padding-top:14px;border-top:1px solid var(--line-soft)}
.b.tall{grid-column:span 2;grid-row:span 2;background:linear-gradient(180deg,var(--violet-50),var(--surface) 52%);
  padding:22px;display:flex;flex-direction:column}
.b.tall .ic{background:var(--surface);border-color:var(--violet-100);color:var(--violet)}
.b.tall .v{font-size:42px}
.b.tall .v i{color:var(--ink-2);font-size:18px}
.b.tall .l{font-size:15px}
.b.tall .x{margin-top:auto}
.b.em .ic{background:var(--emerald-soft);border-color:#CCEBDC;color:var(--emerald-d)}
.b.am .ic{background:var(--amber-soft);border-color:#F3E1C1;color:var(--amber-ink)}
.b.wide{grid-column:span 4}
.mix{display:flex;flex-direction:column;gap:12px;margin:22px 0 4px;position:relative}
.mix .m{display:grid;grid-template-columns:minmax(96px,150px) 1fr 68px;align-items:center;gap:12px;font-size:13.5px;
  color:var(--ink-2);font-weight:600}
.mix .m>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mix .m b{color:var(--ink);text-align:right;font-weight:800}
.mix .t{height:8px;border-radius:6px;background:var(--line);overflow:hidden}
.mix .t i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#8B5CF6,#6D28D9);
  transform-origin:left;animation:grow .7s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.spark{margin-top:18px}
.spark svg{width:100%;height:56px;overflow:visible}

/* ══ Panel + rows ══════════════════════════════ */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1);overflow:hidden}
.panel-h{padding:18px 20px 15px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.panel-h .lead{margin-top:3px;font-size:16.5px}
.tools{display:flex;gap:10px;flex-wrap:wrap;padding:0 20px 15px;align-items:center}
.panel>.tools:first-child{padding-top:16px}
.srch{flex:1;min-width:260px;display:flex;align-items:center;gap:12px;background:var(--ivory);
  border:1px solid var(--line);border-radius:12px;padding:0 14px;min-height:44px;transition:.18s var(--ease)}
.srch svg{width:20px;height:20px;color:var(--ink-2);flex:0 0 20px}
.srch input{border:none;outline:none;background:none;width:100%;font-size:14.5px;font-weight:500}
.srch:focus-within{border-color:var(--violet);background:var(--surface);box-shadow:0 0 0 4px rgba(124,58,237,.12)}
.seg{display:inline-flex;background:var(--ivory);border:1px solid var(--line);border-radius:14px;padding:4px;gap:3px}
.seg button{min-height:38px;padding:0 14px;border-radius:9px;font-size:14px;font-weight:700;color:var(--ink-2);
  transition:.18s var(--ease);white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.seg button .n{font-weight:800;opacity:.55;margin-left:7px;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"].s-low{background:var(--amber-soft);color:var(--amber-ink)}
.seg button[aria-pressed="true"].s-out{background:var(--red-soft);color:var(--red-ink)}
.seg button[aria-pressed="true"] .n{opacity:.75}
.sel{position:relative}
.sel select{appearance:none;width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;
  background:var(--ivory);padding:0 40px 0 14px;font-size:14.5px;font-weight:600;outline:none;cursor:pointer}
.sel select:focus{border-color:var(--violet);background:var(--surface);box-shadow:0 0 0 4px rgba(124,58,237,.12)}
.sel .ch{position:absolute;right:15px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--ink-2)}
.sel .ch svg{width:19px;height:19px}

.rows{display:flex;flex-direction:column;padding:6px 10px 10px}
.row{display:flex;align-items:center;gap:16px;padding:10px 12px;border-radius:12px;cursor:pointer;
  min-height:62px;transition:background .16s var(--ease)}
.row+.row{border-top:1px solid var(--line-soft)}
.row:hover{background:var(--ivory);border-color:transparent}
.row:hover+.row{border-top-color:transparent}
.row:focus-visible{outline:2.5px solid var(--violet);outline-offset:-2px}
.thumb{width:40px;height:40px;flex:0 0 40px;border-radius:11px;display:grid;place-items:center;
  background:var(--violet-50);border:1px solid var(--line);color:var(--violet)}
.thumb svg{width:19px;height:19px}
.row .nm{flex:1;min-width:150px}
.row .nm b{display:block;font-size:15.5px;font-weight:700;letter-spacing:-.022em;line-height:1.3}
.row .nm span{display:block;font-size:13.5px;color:var(--ink-2);font-weight:500;line-height:1.35}
.row .lvl{width:118px;flex:0 0 118px}
.cap{height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.cap i{display:block;height:100%;border-radius:4px;background:var(--emerald);transition:width .35s var(--ease)}
.cap.low i{background:var(--amber)}
.cap.out i{background:var(--red)}
.row .lvl small{display:block;margin-top:6px;font-size:12px;color:var(--ink-3);font-weight:600}
.row .qt{width:100px;flex:0 0 100px;text-align:right}
.row .qt b{display:block;font-size:19px;font-weight:800;letter-spacing:-.035em;line-height:1.15}
.row .qt span{display:block;font-size:12.5px;color:var(--ink-2);font-weight:600}
.row .st{width:150px;flex:0 0 150px}
.row .chev{color:var(--ink-3);opacity:0;transform:translateX(-6px);transition:.18s var(--spring)}
.row:hover .chev,.row:focus-visible .chev{opacity:1;transform:none}
.row .chev svg{width:21px;height:21px}
/* ══ Status ════════════════════════════════════ */
.tag{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:5px 12px 5px 10px;
  font-size:13.5px;font-weight:700;white-space:nowrap}
.tag .d{width:8px;height:8px;border-radius:50%;background:currentColor;flex:0 0 8px}
.tag.ok{background:var(--emerald-soft);color:var(--emerald-d)}
.tag.low{background:var(--amber-soft);color:var(--amber-ink)}
.tag.out{background:var(--red-soft);color:var(--red-ink)}
.tag.ok .d{box-shadow:0 0 0 4px rgba(22,163,106,.14)}
.tag.low .d{box-shadow:0 0 0 4px rgba(233,162,59,.16)}
.tag.out .d{box-shadow:0 0 0 4px rgba(220,76,76,.14)}

/* ══ Detail ════════════════════════════════════ */
.back{display:inline-flex;align-items:center;gap:9px;min-height:48px;padding:0 16px 0 11px;border-radius:13px;
  font-size:16.5px;font-weight:700;color:var(--ink-2);transition:.16s var(--ease)}
.back svg{width:20px;height:20px;transition:transform .18s var(--spring)}
.back:hover{background:var(--ivory);color:var(--ink)}
.back:hover svg{transform:translateX(-3px)}
.code svg{width:16px;height:16px;flex:0 0 16px;color:var(--ink-3)}
.code{display:inline-flex;align-items:center;gap:8px;background:var(--ivory);border:1px solid var(--line);
  border-radius:11px;padding:6px 13px;font-size:15.5px;font-weight:700;color:var(--ink-2)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:26px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--sh-1)}
.stat b{display:block;font-size:33px;font-weight:800;letter-spacing:-.045em;line-height:1}
.stat span{display:block;font-size:14px;color:var(--ink-2);font-weight:600;margin-top:5px}
.stat.hero{background:linear-gradient(180deg,var(--violet-50),var(--surface) 70%);border-color:var(--violet-100)}
.stat.hero b{font-size:39px}
.info .r{display:flex;justify-content:space-between;gap:18px;padding:13px 20px;font-size:14.5px;
  box-shadow:inset 0 -1px 0 var(--line-soft)}
.info .r:last-child{box-shadow:none}
.info .r span{color:var(--ink-2);font-weight:500}
.info .r b{font-weight:700;text-align:right}

/* ══ Steps / forms ═════════════════════════════ */
.steps{display:flex;align-items:center;margin-bottom:26px;flex-wrap:wrap}
.stp{display:flex;align-items:center;gap:11px}
.stp .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:16px;font-weight:800;
  background:var(--surface);border:1px solid var(--line);color:var(--ink-3);transition:.26s var(--spring)}
.stp .n svg{width:19px;height:19px}
.stp b{font-size:14px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.stp.on .n{background:linear-gradient(150deg,#8B5CF6,#6D28D9);border-color:transparent;color:#fff;
  box-shadow:var(--sh-accent);transform:scale(1.06)}
.stp.on b{color:var(--ink);font-weight:700}
.stp.done .n{background:var(--violet-50);border-color:transparent;color:var(--violet)}
.lnk{width:40px;height:2px;background:var(--line);margin:0 14px;flex:0 0 40px;border-radius:2px;overflow:hidden}
.lnk i{display:block;height:100%;width:0;background:var(--violet);transition:width .4s var(--ease)}
.lnk.fill i{width:100%}
.field{margin-bottom:26px}
.field:last-child{margin-bottom:0}
.field>label{display:block;font-size:14.5px;font-weight:700;margin-bottom:9px}
/* the search box is a <label class="srch"> — the rule above made it a block, which put its icon on a line of its own */
.field>label.srch{display:flex;font-size:14.5px;font-weight:500;margin-bottom:12px}
.field .hint{font-size:13.5px;color:var(--ink-2);margin:-3px 0 12px;font-weight:500}
.inp{width:100%;min-height:46px;border:1px solid var(--line);border-radius:11px;background:var(--ivory);
  padding:0 14px;font-size:15px;font-weight:600;outline:none;transition:.18s var(--ease)}
.inp:focus{border-color:var(--violet);background:var(--surface);box-shadow:0 0 0 4px rgba(124,58,237,.12)}
textarea.inp{min-height:98px;padding:15px 16px;resize:vertical;font-weight:500;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.sendgrid{display:grid;grid-template-columns:1.5fr 1fr;align-items:start;gap:24px}
.qty-in{display:flex;gap:12px}
.qty-in .inp{font-size:25px;font-weight:800;min-height:58px;text-align:center;flex:1}
.qty-in .sel{min-width:160px}
.qty-in .sel select{min-height:58px;font-size:15px}
.chips{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:40px;
  padding:0 15px;font-size:14px;font-weight:700;color:var(--ink-2);transition:.18s var(--spring)}
.chips button:hover{border-color:var(--violet);color:var(--violet);background:var(--violet-50);transform:translateY(-2px)}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-height:400px;overflow-y:auto;padding:2px}
.pick{display:flex;align-items:center;gap:13px;border:1px solid var(--line);background:var(--surface);
  border-radius:13px;padding:13px;min-height:68px;text-align:left;width:100%;box-shadow:var(--sh-1);
  transition:.18s var(--ease)}
.pick:hover{border-color:#D3D8E0;transform:translateY(-2px);box-shadow:var(--sh-2)}
.pick .thumb{width:38px;height:38px;flex:0 0 38px;border-radius:11px}
.pick .thumb svg{width:21px;height:21px}
.pick b{display:block;font-size:15px;font-weight:700}
.pick span{display:block;font-size:13.5px;color:var(--ink-2);font-weight:500}
.pick .tk{margin-left:auto;color:var(--violet);opacity:0;transform:scale(.6);transition:.22s var(--spring)}
.pick .tk svg{width:26px;height:26px}
.pick[aria-pressed="true"]{border-color:var(--violet);background:var(--violet-50);box-shadow:0 0 0 1px var(--violet)}
.pick[aria-pressed="true"] .tk{opacity:1;transform:scale(1)}
.pick[aria-pressed="true"] .thumb{background:var(--surface);border-color:var(--violet-100)}
.notify{border:1px solid var(--line);border-radius:16px;padding:18px;background:var(--surface-2)}
.notify .top{display:flex;align-items:center;gap:14px}
.notify .wi{width:44px;height:44px;flex:0 0 44px;border-radius:13px;background:var(--emerald-soft);
  color:var(--emerald-d);display:grid;place-items:center}
.notify .wi svg{width:22px;height:22px}
.notify b{display:block;font-size:15px;font-weight:700}
.notify .sub{font-size:13.5px;color:var(--ink-2);font-weight:500}
.tog{width:56px;height:32px;border-radius:20px;background:var(--line);position:relative;flex:0 0 56px;
  transition:background .2s var(--ease);margin-left:auto}
.tog i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;
  box-shadow:0 2px 5px rgba(0,0,0,.22);transition:left .22s var(--spring)}
.tog[aria-pressed="true"]{background:var(--emerald)}
.tog[aria-pressed="true"] i{left:27px}
.bubble{margin-top:14px;background:var(--emerald-soft);border:1px solid var(--emerald-soft);border-radius:14px;
  border-bottom-left-radius:6px;padding:12px 14px;font-size:14px;line-height:1.55;color:var(--ink)}
.bubble .meta{display:block;margin-top:9px;font-size:14.5px;color:var(--ink-2);font-weight:600}
.review{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--ivory)}
.review .r{display:flex;justify-content:space-between;gap:16px;padding:13px 17px;font-size:14.5px;
  box-shadow:inset 0 -1px 0 var(--line)}
.review .r:last-child{box-shadow:none}
.review .r span{color:var(--ink-2);font-weight:500}
.review .r b{font-weight:700;text-align:right}

/* maths panel */
.math{background:linear-gradient(180deg,var(--violet-50),var(--surface) 80%);border:1px solid var(--violet-100);border-radius:var(--r-lg);
  padding:20px;box-shadow:var(--sh-1)}
.math .r{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:8px 0;
  font-size:14.5px;color:var(--ink-2);font-weight:600}
.math .r b{color:var(--ink);font-size:20px;font-weight:700}
.math .sep{height:1px;background:var(--line);margin:8px 0}
.math .fin{font-size:16px;color:var(--ink);font-weight:700;padding-top:12px}
.math .big{font-size:40px;font-weight:800;letter-spacing:-.04em;color:var(--emerald-d);text-align:right;line-height:1.05}
.math.over{background:linear-gradient(180deg,var(--red-soft),var(--surface) 80%);border-color:#F5C9C9}
.math.over .big{color:var(--red-ink)}
.math .cap2{color:var(--ink-3);font-size:14px;font-weight:600;text-align:right}
.warn{display:flex;gap:11px;align-items:flex-start;background:var(--red-soft);border:1px solid #F5C9C9;
  color:var(--red-ink);border-radius:14px;padding:15px 17px;font-size:16.5px;font-weight:600;margin-top:16px}
.warn svg{width:21px;height:21px;flex:0 0 21px;margin-top:1px}

/* ══ Success ═══════════════════════════════════ */
.ok{max-width:540px;margin:44px auto;text-align:center;animation:rise .4s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ring{width:84px;height:84px;margin:0 auto 26px;border-radius:50%;display:grid;place-items:center;
  background:var(--emerald-soft);animation:pop .5s var(--spring)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.ring svg{width:42px;height:42px;color:var(--emerald)}
.ring path{stroke-dasharray:36;stroke-dashoffset:36;animation:draw .5s .2s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.ok .big{font-size:34px;font-weight:800;letter-spacing:-.04em;margin:22px 0 2px}
.ok .to{font-size:18px;color:var(--ink-2);font-weight:500}
.ok-card{background:var(--ivory);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;margin:26px 0}
.ok-card .r{display:flex;justify-content:space-between;gap:16px;font-size:17px;padding:7px 0}
.ok-card .r span{color:var(--ink-2);font-weight:500}
.ok-card .r b{font-weight:700}

/* ══ Timeline ══════════════════════════════════ */
.day{font-size:16px;font-weight:800;letter-spacing:-.02em;margin:28px 0 14px;display:flex;align-items:center;gap:12px}
.day:first-of-type{margin-top:8px}
.day .cnt{font-size:15px;font-weight:700;color:var(--ink-2);background:var(--ivory);border:1px solid var(--line);
  border-radius:999px;padding:3px 11px}
.tl{position:relative;padding-left:30px}
.tl::before{content:"";position:absolute;left:13px;top:14px;bottom:14px;width:2px;
  background:linear-gradient(180deg,var(--line),transparent)}
.ev{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px 16px;
  margin-bottom:12px;display:flex;align-items:center;gap:18px;box-shadow:var(--sh-1);transition:.18s var(--ease)}
.ev:hover{transform:translateX(2px);box-shadow:var(--sh-2)}
.ev::before{content:"";position:absolute;left:-23px;top:30px;width:11px;height:11px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.ev.in::before{border-color:var(--emerald);background:var(--emerald);box-shadow:0 0 0 4px rgba(22,163,106,.13)}
.ev.out::before{border-color:var(--violet);background:var(--violet);box-shadow:0 0 0 4px rgba(29,48,80,.1)}
.ev .ar{width:36px;height:36px;flex:0 0 36px;border-radius:11px;display:grid;place-items:center}
.ev.in .ar{background:var(--emerald-soft);color:var(--emerald-d)}
.ev.out .ar{background:var(--violet-50);color:var(--violet)}
.ev .ar svg{width:20px;height:20px}
.ev .tx{flex:1;min-width:0}
.ev .tx .k{font-size:15px;font-weight:700;color:var(--ink-2)}
.ev .tx b{display:block;font-size:15.5px;font-weight:700;letter-spacing:-.02em}
.ev .tx span{display:block;font-size:13.5px;color:var(--ink-2);font-weight:500}
.ev .amt{text-align:right;white-space:nowrap}
.ev .amt b{display:block;font-size:19px;font-weight:800;letter-spacing:-.035em}
.ev.in .amt b{color:var(--emerald-d)}
.ev.out .amt b{color:var(--violet)}
.ev .amt span{display:block;font-size:15.5px;color:var(--ink-2);font-weight:600}

/* ══ Command palette ═══════════════════════════ */
.scrim{position:fixed;inset:0;background:rgba(11,22,40,.42);backdrop-filter:blur(3px);z-index:80;opacity:0;
  pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.cmdk{position:fixed;top:12vh;left:50%;transform:translate(-50%,-10px) scale(.98);width:min(620px,92vw);z-index:90;
  background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh-3);overflow:hidden;
  opacity:0;pointer-events:none;transition:.22s var(--ease)}
.cmdk.on{opacity:1;pointer-events:auto;transform:translate(-50%,0) scale(1)}
.cmdk-top{display:flex;align-items:center;gap:13px;padding:18px 20px;border-bottom:1px solid var(--line)}
.cmdk-top svg{width:22px;height:22px;color:var(--ink-2);flex:0 0 22px}
.cmdk-top input{border:none;outline:none;background:none;width:100%;font-size:16px;font-weight:600}
.cmdk-list{max-height:min(420px,54vh);overflow-y:auto;padding:8px}
.cmdk-lbl{font-size:14px;font-weight:700;color:var(--ink-3);padding:12px 12px 6px}
.ci{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px;border-radius:13px;min-height:58px}
.ci .thumb{width:38px;height:38px;flex:0 0 38px;border-radius:11px}
.ci .thumb svg{width:18px;height:18px}
.ci b{display:block;font-size:15px;font-weight:700}
.ci span{display:block;font-size:15px;color:var(--ink-2);font-weight:500}
.ci .r{margin-left:auto}
.ci.sel,.ci:hover{background:var(--ivory)}
.ci.sel{box-shadow:inset 0 0 0 1px var(--line)}
.cmdk-foot{display:flex;gap:16px;padding:12px 20px;border-top:1px solid var(--line);background:var(--ivory);
  font-size:14.5px;color:var(--ink-2);font-weight:600}

/* ══ Empty / skeleton / toast ══════════════════ */
.empty{text-align:center;padding:64px 24px}
.empty .ic{width:62px;height:62px;margin:0 auto 18px;border-radius:19px;background:var(--ivory);
  border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2)}
.empty .ic svg{width:28px;height:28px}
.empty h3{font-size:17.5px;margin-bottom:7px}
.empty p{font-size:14.5px;color:var(--ink-2);max-width:380px;margin:0 auto 22px;font-weight:500}
.sk{background:linear-gradient(90deg,var(--line-soft) 25%,var(--surface-2) 50%,var(--line-soft) 75%);background-size:400% 100%;
  animation:shim 1.4s ease-in-out infinite;border-radius:8px;height:14px}
@keyframes shim{0%{background-position:100% 0}100%{background-position:0 0}}
.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,16px);z-index:100;background:var(--shell-2);
  color:#fff;border-radius:16px;padding:15px 22px;font-size:17px;font-weight:700;display:flex;align-items:center;
  gap:12px;box-shadow:var(--sh-3);opacity:0;pointer-events:none;transition:.24s var(--spring);max-width:92vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast svg{width:23px;height:23px;color:var(--emerald-l);flex:0 0 23px}
.enter>*{animation:up .42s var(--ease) both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.enter>*:nth-child(2){animation-delay:.05s}
.enter>*:nth-child(3){animation-delay:.1s}
.enter>*:nth-child(4){animation-delay:.15s}

/* ══ Long lists: a "Show more" bar under the first page ══ */
.more{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:14px 16px 18px;
  color:var(--ink-2);font-size:13.5px;font-weight:600;border-top:1px solid var(--line-soft)}
.more .btn{min-height:38px;font-size:13.5px;padding:0 14px}
.more .btn.ghost{border-color:transparent;background:transparent;color:var(--violet);box-shadow:none}
.more .btn.ghost:hover{background:var(--violet-50);transform:none}
.picks+.more,.picks .more{grid-column:1/-1}
.chips.f{margin:0;gap:8px}
.lvlbar{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 14px}
.lvlbar button{min-height:34px;padding:0 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink-2);font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:7px}
.lvlbar button:hover{border-color:var(--ink-3);color:var(--ink)}
.lvlbar button[aria-pressed="true"]{background:var(--violet-50);border-color:var(--violet-100);color:var(--violet)}
.lvlbar button[aria-pressed="true"].l-low{background:var(--amber-soft);border-color:#F0DDBE;color:var(--amber-ink)}
.lvlbar button[aria-pressed="true"].l-out{background:var(--red-soft);border-color:#F5C9C9;color:var(--red-ink)}
.lvlbar .n{font-weight:800;opacity:.7;font-variant-numeric:tabular-nums}

/* ══ Notifications: a panel under the bell (a bottom sheet on a phone) ══ */
.wn{position:fixed;z-index:95;width:380px;max-width:calc(100vw - 20px);max-height:min(540px,calc(100vh - 84px));display:none;
  flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-3);overflow:hidden}
.wn.on{display:flex}
.wn-h{display:flex;align-items:center;gap:10px;padding:14px 12px 12px 18px;border-bottom:1px solid var(--line-soft)}
.wn-h h3{margin:0;font-size:16px}
.wn-h .n{font-size:12px;font-weight:800;padding:2px 9px;border-radius:99px;background:var(--violet-50);color:var(--violet)}
.wn-h .x{margin-left:auto}
.wn-b{overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:2px}
.wn-row{display:flex;align-items:flex-start;gap:12px;width:100%;padding:12px 10px;border-radius:12px;text-align:left}
.wn-row:hover,.wn-row:focus-visible{background:var(--surface-2)}
.wn-ic{width:38px;height:38px;flex:0 0 38px;border-radius:11px;display:grid;place-items:center}
.wn-ic svg{width:19px;height:19px}
.wn-row.bad .wn-ic{background:var(--red-soft);color:var(--red-ink)}
.wn-row.warn .wn-ic{background:var(--amber-soft);color:var(--amber-ink)}
.wn-row.info .wn-ic{background:var(--violet-50);color:var(--violet)}
.wn-t{flex:1;min-width:0}
.wn-t b{display:block;font-size:14.5px;font-weight:700;line-height:1.35}
.wn-t span{display:block;margin-top:2px;font-size:13px;color:var(--ink-2);font-weight:500;line-height:1.4}
.wn-go{align-self:center;color:var(--ink-3)}
.wn-go svg{width:18px;height:18px}
.wn-empty{padding:34px 22px 30px;text-align:center}
.wn-empty .ic{width:50px;height:50px;margin:0 auto 12px;border-radius:15px;display:grid;place-items:center;background:var(--emerald-soft);color:var(--emerald-d)}
.wn-empty .ic svg{width:25px;height:25px}
.wn-empty b{display:block;font-size:15.5px}
.wn-empty p{margin:4px 0 0;font-size:14px;color:var(--ink-2)}
.wn-scrim{position:fixed;inset:0;z-index:94;background:rgba(14,11,24,.4);display:none}
.wn-scrim.on{display:block}

/* ══ Responsive ════════════════════════════════ */
.tabbar{display:none}
@media (max-width:1240px){
  .bento{grid-template-columns:repeat(2,1fr)}
  .b.tall{grid-column:span 2;grid-row:auto}
  .b.tall .v{font-size:46px}
  .b.wide{grid-column:span 2}
  .three{grid-template-columns:1fr}
}
@media (max-width:1100px){
  /* the labelled menu gives way to the icon rail before it can squeeze the page */
  body:not(.wide){--rail:68px}
  body:not(.wide) .brand{justify-content:center;padding-left:0;padding-right:0}
  body:not(.wide) .brand .bt,body:not(.wide) .nv .lb,body:not(.wide) .nvb,body:not(.wide) .rail-foot .ft,body:not(.wide) .nvg{display:none}
  body:not(.wide) .nv{justify-content:center;padding:0}
  body:not(.wide) .rail-foot{justify-content:center}
  body:not(.wide) .nvg:not(:first-child){display:block;height:1px;padding:0;margin:8px 4px;border:0;background:var(--line-soft);font-size:0;overflow:hidden}
  body:not(.wide) .nvg::after{content:none}
  body:not(.wide) .nvdot{display:block}
}
@media (max-width:1024px){
  .rail{display:none}
  .canvas{margin-left:0}
  #collapse{display:none}
  .body{padding:14px 16px 120px}
  .tbar{padding:0 12px;gap:8px}
  .kbtn{width:36px;padding:0;justify-content:center;border-color:transparent;background:none}
  .kbtn .kt,.kbtn .kbd{display:none}
  .picks{grid-template-columns:1fr;max-height:none}
  .sendgrid{grid-template-columns:1fr}
  .row{flex-wrap:wrap;gap:12px 16px;padding:14px}
  .row .nm{flex:1 1 auto;min-width:0}

/* ══ Sparkline ═══════════════════════════════════ */
function spark(){
  const W=300,H=56,max=Math.max(...WEEK.flatMap(d=>[d.in,d.out]))||1;
  const x=i=>i*(W/(WEEK.length-1));
  const y=v=>H-(v/max)*(H-8)-4;
  const path=k=>WEEK.map((d,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(d[k]).toFixed(1)}`).join(' ');
  const area=`${path('in')} L${W},${H} L0,${H} Z`;
  return `<div class="spark"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Stock in and out over the last seven days">
    <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4FD69C" stop-opacity=".38"/><stop offset="100%" stop-color="#4FD69C" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#sg)"/>
    <path d="${path('in')}" fill="none" stroke="#4FD69C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${path('out')}" fill="none" stroke="#7E8DA5" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round" stroke-linejoin="round"/>
  </svg></div>`;
}
function mixBars(){
  const by={};PRODUCTS.forEach(p=>by[p.brand]=(by[p.brand]||0)+p.bags);
  const top=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,3),max=top[0][1]||1;
  return `<div class="mix">${top.map(([b,v],i)=>`<div class="m"><span>${b}</span>
    <span class="t"><i style="width:${Math.max(Math.round(v/max*100),3)}%;animation-delay:${i*.08+.15}s"></i></span>
    <b class="num">${nf(v)}</b></div>`).join('')}</div>`;
}

const PAGE=40;
function pageOf(list,key){const n=S.lim[key]||PAGE;return{shown:n>=list.length?list:list.slice(0,n),left:Math.max(0,list.length-n),total:list.length,key:key};}
function moreBar(pg,noun){
  if(!pg.left)return '';
  return `<div class="more"><span>Showing ${nf(pg.total-pg.left)} of ${nf(pg.total)} ${noun}</span>
    <button class="btn" data-more="${pg.key}">Show ${nf(Math.min(PAGE,pg.left))} more</button>
    ${pg.left>PAGE?`<button class="btn ghost" data-more="${pg.key}" data-all="1">Show all ${nf(pg.total)}</button>`:''}</div>`;
}

SC.send=()=>{
  const o=S.out, p=o.prod?prodOf(o.prod):null, shop=SHOPS.find(s=>s.id===o.shop);
  const selInv=SERVER&&o.inv?(o.invs||[]).find(v=>v.id===o.inv):null;
  const linked=!!selInv&&selInv.taken;                           /* the invoice already took the bags out of stock: this dispatch only records the delivery */
  const have=p&&o.wid?stockAt(p.id,o.wid):0, over=!!p&&!linked&&o.qty>have;
  const ready=p&&o.wid&&o.qty>0&&!over&&(SHOPS.length?!!o.shop:!SERVER)&&!S.busy;
  const sq=(S.sq||'').toLowerCase().trim();
  const hit=SHOPS.filter(s=>!sq||(s.sh+' '+((regionOf(s.region)||{}).en||'')).toLowerCase().includes(sq));
  const spg=pageOf(hit,'shops'), shopsShown=spg.shown;
  const reg=shop?regionOf(shop.region):null;
  let n=0; const step=()=>++n;
  return `
  <button class="back" data-go="home">${I('left',2)}Back to home</button>
  <div class="head"><div class="grow"><h1>Dispatch stock</h1>
    <p class="lead">Bags leaving a warehouse for a shop</p></div></div>
  ${!SHOPS.length?(SERVER
    ?`<div class="banner warn" style="margin-bottom:18px">${I('alert')}
    <div><b>No shops in the company records yet</b><p>A dispatch has to name the shop. The office adds shops under Master data.</p></div></div>`
    :`<div class="banner warn" style="margin-bottom:18px">${I('alert')}
    <div><b>No shops on this device yet</b><p>Shops and their regions come from the office system.
    You can still record the dispatch — the office will attach the shop.</p></div></div>`):''}
  <div class="sendgrid">
    <div class="panel" style="padding:22px">
      ${SHOPS.length?`<div class="field"><label>${step()}. Which shop?</label>
        <label class="srch" style="margin-bottom:12px">${I('search')}
          <input id="sq" value="${E(S.sq||'')}" placeholder="Search shop or area" aria-label="Search shop" autocomplete="off"></label>
        <div class="picks" style="max-height:none">${shopsShown.map((s,ix)=>`<button class="pick" data-i="${ix}" aria-pressed="${o.shop===s.id}" data-oshop="${s.id}">
          <span class="thumb">${I('shop')}</span>

function countUp(){
  document.querySelectorAll('[data-count]').forEach(el=>{
    const target=+el.dataset.count, suffix=el.innerHTML.replace(/^[\d,]*\s*/,'');
    if(!target){el.innerHTML='0 '+suffix;return;}
    const dur=650,t0=performance.now();
    const tick=now=>{
      const k=Math.min((now-t0)/dur,1), e=1-Math.pow(1-k,3);
      el.innerHTML=nf(Math.round(target*e))+' '+suffix;
      if(k<1)requestAnimationFrame(tick);
    };requestAnimationFrame(tick);
  });
}

const WN_SEEN='farooqco_wh_notif_seen';
function wnItems(){
  const out=[];
  if(document.body.classList.contains('off'))out.push({id:'off',tone:'bad',icon:'wifiOff',title:'No internet right now',
    detail:SERVER?'Nothing can be received or dispatched until the connection is back.':'Entries stay on this device and upload by themselves when the connection returns.'});
  if(S.err)out.push({id:'err',tone:'bad',icon:'alert',title:'Your last entry was not saved',detail:E(S.err)});
  const waiting=QUEUE.filter(q=>!q.synced).length;
  if(!SERVER&&waiting)out.push({id:'q',tone:'warn',icon:'history',title:nf(waiting)+(waiting===1?' entry is':' entries are')+' waiting to upload',detail:'They upload by themselves when the internet is back.'});
  const nm=l=>{const a=l.slice(0,3).map(p=>E(p.en||p.ur||'Product'));return a.join(', ')+(l.length>3?' and '+nf(l.length-3)+' more':'');};
  const none=PRODUCTS.filter(p=>level(p)==='out'), low=PRODUCTS.filter(p=>level(p)==='low');
  if(none.length)out.push({id:'out',tone:'bad',icon:'box',title:nf(none.length)+(none.length===1?' product has no stock':' products have no stock'),detail:nm(none),go:'stock',lvl:'out'});
  if(low.length)out.push({id:'low',tone:'warn',icon:'alert',title:nf(low.length)+(low.length===1?' product is running low':' products are running low'),detail:nm(low),go:'stock',lvl:'low'});

}
const wnSig=l=>l.map(x=>x.id+':'+x.title).join('|');
const wnOpen=()=>document.getElementById('wn').classList.contains('on');
function wnPlace(){
  const el=document.getElementById('wn'),b=document.getElementById('bellBtn'),w=window.innerWidth;
  if(w<=640){el.style.top=el.style.left=el.style.right='';return;}
  const r=b.getBoundingClientRect(),wd=Math.min(380,w-20);
  el.style.left=Math.max(10,Math.min(r.right-wd,w-wd-10))+'px';el.style.right='auto';el.style.top=Math.round(r.bottom+8)+'px';
}
function wnShow(){
  const el=document.getElementById('wn'),l=wnItems();
  el.innerHTML=`<div class="wn-h"><h3>Notifications</h3>${l.length?`<span class="n">${l.length}</span>`:''}
      <button class="icobtn x" data-wnclose="1" aria-label="Close notifications">${I('x',2)}</button></div>`+
    (l.length?`<div class="wn-b">${l.map(n=>`<${n.go?'button':'div'} class="wn-row ${n.tone}"${n.go?` data-wngo="${n.go}"${n.lvl?` data-wnlvl="${n.lvl}"`:''}`:''}>
        <span class="wn-ic">${I(n.icon,2)}</span><span class="wn-t"><b>${n.title}</b><span>${n.detail}</span></span>
        ${n.go?`<span class="wn-go">${I('right',2)}</span>`:''}</${n.go?'button':'div'}>`).join('')}</div>`
     :`<div class="wn-empty"><div class="ic">${I('checkC',2)}</div><b>You are all caught up</b><p>Nothing needs your attention right now.</p></div>`);
  wnPlace();el.classList.add('on');
  if(window.innerWidth<=640)document.getElementById('wnScrim').classList.add('on');
  document.getElementById('bellBtn').setAttribute('aria-expanded','true');
  try{localStorage.setItem(WN_SEEN,wnSig(l));}catch(_){}

function wnClose(restore){
  document.getElementById('wn').classList.remove('on');document.getElementById('wnScrim').classList.remove('on');

function wnDot(){

  const b=document.getElementById('bellBtn'),d=b&&b.querySelector('.dot'),fresh=l.length>0&&wnSig(l)!==seen;
  if(d)d.classList.toggle('hide',!fresh);
  if(b)b.setAttribute('aria-label',l.length?'Notifications — '+l.length+(l.length===1?' item':' items')+(fresh?', new':''):'Notifications — none');
}

/* ══ Shared store — the same record the owner ERP uses ══ */
const DB_KEY='farooqco_erp_v1';
function dbRead(){ try{return JSON.parse(localStorage.getItem(DB_KEY)||'null');}catch(e){return null;} }
function dbLoad(){
  const d=dbRead(); if(!d||d.v!==1)return false;
  STOCKMAP=d.stock||{};
  if(d.products&&d.products.length)PRODUCTS=d.products.map(p=>({id:p.id,ur:p.ur,en:p.en,cat:p.cat,kg:p.kg,min:p.min}));
  if(d.warehouses&&d.warehouses.length)WAREHOUSES=d.warehouses.map(w=>({id:w.id,name:w.name}));
  if(d.regions&&d.regions.length)REGIONS=d.regions.filter(r=>r.active!==false&&!r.deleted).map(r=>({id:r.id,ur:r.ur,en:r.en}));
  /* Shops come from the office system */
  SHOPS=(d.customers||[]).map(c=>({id:c.id,sh:c.sh,region:c.region,wa:c.wa}));
  /* Show this device's recent movements, newest first */
  HISTORY=(d.moves||[]).slice(0,40).map(m=>({t:m.delta>0?'in':'out',pid:m.pid,wid:m.wid,
    qty:Math.abs(m.delta),who:m.note||m.ref||m.kind,region:null,when:m.t||'earlier'}));
  return true;
}
/* Write our movement back into the shared record without clobbering office data */
function dbPush(move){
  const d=dbRead(); if(!d||d.v!==1)return;
  d.stock=STOCKMAP;
  d.moves=[Object.assign({id:'MV-'+Date.now().toString(36),by:'Warehouse app'},move)].concat(d.moves||[]);
  try{localStorage.setItem(DB_KEY,JSON.stringify(d));}catch(e){}
  try{parent.postMessage({type:'farooqco:changed'},'*');}catch(e){}
}

paintTheme();
if(!/Mac|iPhone|iPad/.test(navigator.platform))document.getElementById('kHint').textContent='Ctrl K';

document.addEventListener('click',e=>{
  const h=s=>e.target.closest(s);
  if(h('#openCmdk')){openCmdk();return;}
  if(h('#scrim')){closeCmdk();return;}
  if(h('#collapse')){
    const cls=railNarrow()?'wide':'mini', on=document.body.classList.toggle(cls);
    try{localStorage.setItem(RAIL_KEY,on?cls:'');}catch(_){}
    syncRail();return;}
  if(h('#bellBtn')){wnOpen()?wnClose():wnShow();return;}
  if(h('[data-wnclose]')||h('#wnScrim')){wnClose();return;}
  const wg=h('[data-wngo]'); if(wg){const lv=wg.dataset.wnlvl;wnClose(false);go(wg.dataset.wngo);if(lv){S.lvl=lv;paint();}return;}
  if(document.getElementById('wn').classList.contains('on')&&!h('#wn'))wnClose(false);
  const mo=h('[data-more]'); if(mo){
    const k=mo.dataset.more, before=(S.lim[k]||PAGE);
    S.lim[k]=mo.dataset.all?1e9:before+PAGE;paint();
    const nx=view.querySelector('[data-i="'+before+'"]'); if(nx&&nx.focus)nx.focus({preventScroll:true});return;}
  const lv=h('[data-lvl]'); if(lv){S.lvl=lv.dataset.lvl;S.lim={};paint();return;}
  if(h('#themeBtn')){
    const el=document.documentElement, dark=el.getAttribute('data-theme')==='dark';
    el.setAttribute('data-theme',dark?'light':'dark');paintTheme();
    toast(dark?'Light mode on':'Dark mode on');return;}
  const g=h('[data-go]'); if(g){closeCmdk();go(g.dataset.go);return;}
  const p=h('[data-prod]'); if(p){closeCmdk();S.prod=p.dataset.prod;go('product');return;}
  const tb=h('[data-tab]'); if(tb){S.tab=tb.dataset.tab;S.lim={};paint();return;}
  if(h('[data-clear]')){S.q='';S.lvl='all';S.lim={};paint();return;}
  const setq=h('[data-set]'); if(setq){S.q=setq.dataset.set;paint();return;}
  const at=h('[data-addthis]'); if(at){S.add={prod:at.dataset.addthis,q:'',qty:100,supplier:'',wid:null};
    S.step=2;S.screen='add';paint();return;}
  const st=h('[data-sendthis]'); if(st){S.out.prod=st.dataset.sendthis;go('send');return;}

  /* receive flow */
  const ap=h('[data-apick]'); if(ap){S.add.prod=ap.dataset.apick;paint();return;}
  const aq=h('[data-setqty]'); if(aq){S.add.qty=+aq.dataset.setqty;paint();return;}
  const qb=h('[data-qty]'); if(qb){S.add.qty=Math.max(0,S.add.qty+ +qb.dataset.qty);paint();return;}
  const asup=h('[data-sup]'); if(asup){S.add.supplier=asup.dataset.sup;paint();return;}
  const awh=h('[data-awh]'); if(awh){S.add.wid=awh.dataset.awh;paint();return;}
  if(h('[data-next]')&&!h('[data-next]').disabled){S.step=Math.min(4,S.step+1);paint();return;}
  if(h('[data-back]')){ if(S.step>1){S.step--;paint();} else go('home'); return; }
  if(h('[data-save]')&&!h('[data-save]').disabled){
    const a2=S.add, pr=prodOf(a2.prod);
    if(!pr||!a2.wid||a2.qty<1){toast('Choose a product, warehouse and quantity');return;}
    if(SERVER){saveServer('RECEIVE');return;}
    STOCKMAP[skey(pr.id,a2.wid)]=stockAt(pr.id,a2.wid)+a2.qty;
    HISTORY.unshift({t:'in',pid:pr.id,wid:a2.wid,qty:a2.qty,who:supName(a2.supplier),region:null,when:'Just now'});
    queueOp({type:'RECEIVE',productId:pr.id,warehouseId:a2.wid,quantity:a2.qty,supplier:supName(a2.supplier)});
    dbPush({t:stampNow(),iso:'2026-09-06',pid:pr.id,wid:a2.wid,delta:a2.qty,kind:'Purchase',ref:'',note:supName(a2.supplier)});
    S.last={title:'Stock received',body:`${nf(a2.qty)} bags of ${pr.en} added to ${whName(a2.wid)} from ${supName(a2.supplier)}.`,
      note:`${whName(a2.wid)} now holds ${nf(stockAt(pr.id,a2.wid))} bags.`,again:['Receive more','add']};
    S.add={prod:null,q:'',qty:100,supplier:'',wid:null};S.step=1;
    go('done');toast('Stock received');return;
  }

  /* dispatch flow */
  const osh=h('[data-oshop]'); if(osh){pickShop(osh.dataset.oshop);return;}
  const oinv=h('[data-oinv]'); if(oinv){S.out.inv=oinv.dataset.oinv;S.err='';paint();return;}
  if(h('[data-retry]')){startApp();return;}
  const owh=h('[data-owh]'); if(owh){S.out.wid=owh.dataset.owh;paint();return;}
  const opk=h('[data-oprod]'); if(opk){S.out.prod=opk.dataset.oprod;paint();return;}
  const oq=h('[data-setoqty]'); if(oq){S.out.qty=+oq.dataset.setoqty;paint();return;}
  const sendBtn=h('[data-send]');
  if(sendBtn&&!sendBtn.disabled){
    const o=S.out, pr=prodOf(o.prod), shop=SHOPS.find(x=>x.id===o.shop);
    if(SERVER){saveServer('DISPATCH');return;}
    const have=stockAt(pr.id,o.wid);
    if(o.qty>have){toast(`${whName(o.wid)} only has ${nf(have)} bags`);return;}
    STOCKMAP[skey(pr.id,o.wid)]=have-o.qty;
    HISTORY.unshift({t:'out',pid:pr.id,wid:o.wid,qty:o.qty,who:shop?shop.sh:'Shop',
      region:shop?shop.region:null,when:'Just now'});
    queueOp({type:'DISPATCH',productId:pr.id,warehouseId:o.wid,customerId:shop?shop.id:null,
      regionId:shop?shop.region:null,quantity:o.qty});
    dbPush({t:stampNow(),iso:'2026-09-06',pid:pr.id,wid:o.wid,delta:-o.qty,kind:'Dispatch',ref:'',
      note:shop?shop.sh:'Shop'});
    S.last={title:'Stock dispatched',
      body:`${nf(o.qty)} bags of ${pr.en} sent from ${whName(o.wid)}${shop?' to '+shop.sh:''}.`,
      note:`${whName(o.wid)} now holds ${nf(stockAt(pr.id,o.wid))} bags.`,again:['Dispatch more','send']};
    S.out={shop:null,prod:null,wid:null,qty:50};
    go('done');toast('Stock dispatched');return;
  }
});

document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='q'){S.q=e.target.value;S.lim={};
    const pos=e.target.selectionStart;paint();
    const n=document.getElementById('q');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}return;}
  if(id==='cq'){S.cq=e.target.value;S.ci=0;paintCmdk();return;}
  if(id==='sq'){S.sq=e.target.value;S.lim={};const pos=e.target.selectionStart;paint();
    const n=document.getElementById('sq');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}return;}
  if(id==='aq'){S.add.q=e.target.value;S.lim={};
    const ph=document.getElementById('pickHost');if(ph)ph.innerHTML=addPicks();return;}
  if(id==='qty'){S.add.qty=+e.target.value.replace(/\D/g,'')||0;return;}
  if(id==='oqty'){S.out.qty=+e.target.value.replace(/\D/g,'')||0;
    const pos=e.target.selectionStart;paint();
    const n=document.getElementById('oqty');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}return;}
});
document.addEventListener('keydown',e=>{
  const open=cmdk.classList.contains('on');
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();open?closeCmdk():openCmdk();return;}
  if(e.key==='Escape'){if(open)closeCmdk();else if(wnOpen())wnClose();return;}
  if(open){
    const all=cmdItems().all;
    if(e.key==='ArrowDown'){e.preventDefault();S.ci=Math.min(S.ci+1,all.length-1);paintCmdk();
      document.querySelector('.ci.sel')?.scrollIntoView({block:'nearest'});}
    if(e.key==='ArrowUp'){e.preventDefault();S.ci=Math.max(S.ci-1,0);paintCmdk();
      document.querySelector('.ci.sel')?.scrollIntoView({block:'nearest'});}
    if(e.key==='Enter'){const it=all[S.ci];if(it){closeCmdk();
      if(it.k==='go')go(it.v);else{S.prod=it.v;go('product');}}}
    return;
  }
  const typing=/input|textarea|select/i.test(document.activeElement.tagName);
  if(e.key==='/'&&!typing){const s=document.getElementById('q');if(s){e.preventDefault();s.focus();s.select();}}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('row')){
    e.preventDefault();S.prod=+e.target.dataset.prod;go('product');}
});
const canvas=document.querySelector('.canvas');
window.addEventListener('scroll',()=>document.getElementById('tbar').classList.toggle('stuck',window.scrollY>6),{passive:true});

/* ══ Company server database (module 39) ═══════════════════════════════════════
   When the server says the company database is in use, everything above runs on ITS data and every entry is one
   save to the server (no "saved on this device"). When the switch is off the page behaves exactly as it always did. */
const E=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const unE=s=>String(s==null?'':s).replace(/&quot;/g,'"').replace(/&gt;/g,'>').replace(/&lt;/g,'<').replace(/&amp;/g,'&');
const errBox=()=>S.err?`<div class="banner warn" style="margin:14px 0">${I('alert')}<div><b>Not saved</b><p>${E(S.err)}</p></div></div>`:'';
function applyModel(m){
  PRODUCTS=m.products;WAREHOUSES=m.warehouses;REGIONS=m.regions;SHOPS=m.shops;SUPPLIERS=m.suppliers;STOCKMAP=m.stock;
  HISTORY=m.history.filter(x=>prodOf(x.pid));            /* a movement of a product that is switched off must not break the list */
}
function pickShop(id){
  S.out.shop=id;S.out.inv='';S.out.invs=null;S.err='';paint();
  if(!SERVER)return;
  FcWH.invoicesFor(id).then(list=>{if(S.out.shop===id){S.out.invs=list;paint();}})
    .catch(()=>{if(S.out.shop===id){S.out.invs=[];paint();}});
}
async function saveServer(type){
  if(S.busy)return;
  const isIn=type==='RECEIVE', src=isIn?S.add:S.out;
  const pr=prodOf(isIn?S.add.prod:S.out.prod), wid=isIn?S.add.wid:S.out.wid, qty=isIn?S.add.qty:S.out.qty;
  if(!pr||!wid||qty<1){toast('Choose a product, warehouse and quantity');return;}
  if(!src.opId)src.opId=FDB.uid('op');                   /* the same id on a retry, so a double tap can never post twice */
  S.busy=true;S.err='';paint();
  try{
    const draft=isIn
      ?{warehouseId:wid,items:[{productId:pr.id,quantity:qty}],clientOpId:src.opId,
        reason:'Received from '+unE(supName(S.add.supplier))+' (Warehouse app)'}
      :{warehouseId:wid,customerId:S.out.shop,invoiceId:S.out.inv||null,items:[{productId:pr.id,quantity:qty}],clientOpId:src.opId};
    const r=await FcWH.post(type,draft);
    applyModel(FcWH.model());
    const d=r.doc, shop=SHOPS.find(x=>x.id===S.out.shop);
    S.last=isIn
      ?{title:'Stock received',body:`${nf(qty)} bags of ${pr.en} added to ${whName(wid)} from ${supName(S.add.supplier)}.`,
        note:`${whName(wid)} now holds ${nf(stockAt(pr.id,wid))} bags.`,ref:d.docNumber,again:['Receive more','add']}
      :{title:'Stock dispatched',body:`${nf(qty)} bags of ${pr.en} sent from ${whName(wid)}${shop?' to '+shop.sh:''}.`,
        note:d.stockApplied?`${whName(wid)} now holds ${nf(stockAt(pr.id,wid))} bags.`:`Recorded against ${d.invoiceNumber} — stock was already taken out by the invoice.`,
        ref:d.docNumber,again:['Dispatch more','send']};
    if(isIn){S.add={prod:null,q:'',qty:100,supplier:'',wid:null};S.step=1;}
    else S.out={shop:null,prod:null,wid:null,qty:50,inv:'',invs:null};
    S.sq='';S.busy=false;go('done');toast(isIn?'Stock received':'Stock dispatched');
  }catch(e){
    S.busy=false;
    if(e&&e.duplicate){                                   /* already saved — the answer was lost on the way back */
      try{await FcWH.refresh();applyModel(FcWH.model());}catch(x){}
      if(isIn){S.add={prod:null,q:'',qty:100,supplier:'',wid:null};S.step=1;}
      else S.out={shop:null,prod:null,wid:null,qty:50,inv:'',invs:null};
      toast('That was already saved'+(e.existing&&e.existing.ref?' as '+e.existing.ref:''));go('home');return;
    }
    if(e&&e.validation){S.err=e.validation.join(' ');paint();return;}
    /* a failed commit has already put up the driver's own blocking "NOT saved — Reload" notice */
    S.err=(e&&e.message)||'The server did not accept the entry.';paint();
  }
}
/* catch up with what other people saved — never in the middle of typing or saving */
function idleNow(){
  const t=(document.activeElement&&document.activeElement.tagName)||'';
  return !S.busy&&S.screen!=='add'&&S.screen!=='send'&&!/input|textarea|select/i.test(t);
}
async function catchUp(force){
  if(!SERVER||!FcWH.stale||S.busy||(!force&&!idleNow()))return;
  try{if(await FcWH.refresh()){applyModel(FcWH.model());paint();}}catch(e){}
}
function bootFailed(err){
  view.innerHTML=`<div class="empty" style="padding:60px 20px"><div class="ic">${I('wifiOff')}</div><h3>Cannot load the stock from the server</h3>
    <p>${E(err&&err.message||'')} Nothing was changed. Check the internet connection and try again.</p>
    <button class="btn em" data-retry="1">Try again</button></div>`;
}
function legacyBoot(){dbLoad();pwaSeedFromMaster();paint(true);setTimeout(()=>paint(),700);}
function startApp(){
  paint(true);
  if(!window.FcWH){legacyBoot();return;}
  FcWH.start().then(mode=>{
    if(mode!=='server'){legacyBoot();return;}
    SERVER=true;
    FcWH.onChange=()=>catchUp();
    setInterval(()=>catchUp(),5000);                     /* picks up news that arrived while the user was typing */
    const off=()=>{document.body.classList.toggle('off',!FcWH.online());paint();if(FcWH.online())catchUp(true);};
    window.addEventListener('online',off);window.addEventListener('offline',off);
    document.body.classList.toggle('off',!FcWH.online());
    applyModel(FcWH.model());paint();
  }).catch(bootFailed);
}

/* first load only */
/* ══ Real master data — seed the shared record if this device opened first ══ */
function pwaSeedFromMaster(){
  var M=window.FAROOQ_ERP_MASTER; if(!M||!M.products||!M.products.length) return;
  var rec=null; try{ rec=JSON.parse(localStorage.getItem(DB_KEY)||'null'); }catch(e){}
  if(rec && rec.v===1 && rec.masterDataVersion===M.version) return;
  var base=(rec && rec.v===1)?rec:{v:1,stock:{},moves:[]};
  base.masterDataVersion=M.version;
  base.products   = (base.products&&base.products.length)?base.products:M.products;
  base.suppliers  = (base.suppliers&&base.suppliers.length)?base.suppliers:M.suppliers;
  base.customers  = (base.customers&&base.customers.length)?base.customers:M.customers;
  base.regions    = (base.regions&&base.regions.length)?base.regions:M.regions;
  base.warehouses = (base.warehouses&&base.warehouses.length)?base.warehouses:WAREHOUSES;
  base.biz        = base.biz||M.business;
  try{ localStorage.setItem(DB_KEY,JSON.stringify(base)); }catch(e){}
  dbLoad();
}

startApp();
